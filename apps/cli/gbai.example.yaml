# gbai configuration for the vulcam cloud server (Railway "vulcam cloud").
# Copy to gbai.yaml. Secrets never go here: use `gbai secrets set`.
server:
  railway:
    project_id: 21669483-8aa3-4bc9-8b1c-63d1785a857b
    environment_id: 5bea8b6f-afec-471f-a757-fc57979b7a24
    service_id: fb7c97ca-82e3-4554-8463-1d00e95fa57f

users:
  orca:
    name: orca
    home: /data/home
    extra_path: [/data/home/.local/bin]
  reviewer:
    name: reviewer
    home: /data/reviewer
    uid: 2000
  reviewer_ci:
    name: reviewer-ci
    home: /data/reviewer-ci
    uid: 2001

runtimes:
  coder: claude
  reviewer: pi
  assistant: claude

repo:
  name: cappy-lab/vulcam
  integration_branch: dev

bot:
  login: vulcambot

# `gbai review run` (as reviewer) and its reviewer-ci side.
review:
  # Run in order inside the merged tree as reviewer-ci; split on whitespace, no shell.
  checks:
    - bun install --frozen-lockfile
    - bun run build
    - bun run check-types
    - bun run lint
    - bun run test
  # Merge clean mode:cloud PRs into the integration branch, pinned to the reviewed head.
  auto_merge: true
  # Never merged automatically. Entries ending in "/" are root directories;
  # others are file names matched at any depth.
  human_only_paths:
    - .claude/
    - .github/
    - .opencode/
    - AGENTS.md
    - CLAUDE.md
    - docs/policies/
    - tools/hook-tests/
    - agents/
  # Env var that receives the pi model credential (claude uses CLAUDE_CODE_OAUTH_TOKEN).
  pi_credential_env: ANTHROPIC_API_KEY
