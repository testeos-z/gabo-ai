# gbai configuration example. Secrets never go here, in any layer: only the
# names of the environment variables that carry them.
#
# Without --config, gbai merges up to three layers, lowest to highest precedence:
#   1. system:  /etc/gbai/gbai.yaml
#   2. user:    $XDG_CONFIG_HOME/gbai/config.yaml, else ~/.config/gbai/config.yaml
#   3. project: gbai.yaml at the git top-level of the current directory
#               (the current directory itself outside a git repository)
# A higher layer overrides only the keys it sets: mappings merge key by key,
# scalars and lists replace the lower value, `key: null` resets it to the default.
# Missing files are skipped; an unknown key fails and names its file. Defaults
# and validation run once on the merged result. `--config <file>` reads exactly
# that one file.

runtimes:
  coder: claude
  reviewer: pi
  assistant: claude

repo:
  name: cappy-lab/vulcam
  integration_branch: dev

# `gbai review run` and its checks side.
review:
  # Run in order inside a copy of the merged tree, with GitHub credentials
  # stripped from the environment; split on whitespace, no shell.
  checks:
    - bun install --frozen-lockfile
    - bun run build
    - bun run check-types
    - bun run lint
    - bun run test
  # Merge clean PRs into the integration branch, pinned to the reviewed head.
  auto_merge: true
  # Never merged automatically. Entries ending in "/" are root directories;
  # others are file names matched at any depth.
  human_only_paths:
    - .claude/
    - .github/
    - .opencode/
    - AGENTS.md
    - CLAUDE.md
    - docs/policies/
    - tools/hook-tests/
    - agents/
  # Env var that receives the pi model credential (claude uses CLAUDE_CODE_OAUTH_TOKEN).
  pi_credential_env: ANTHROPIC_API_KEY
  # Reviewer state (its own clone/, worktrees/ and ci/ workspaces), 0700.
  # Default: $XDG_STATE_HOME/gbai/reviewer, else ~/.local/state/gbai/reviewer.
  # state_dir: /home/owner/.local/state/gbai/reviewer

# GitHub login the coder pushes with, only when it differs from the owner's.
# In single-user mode it is usually unset.
# coder:
#   login: vulcam-coder

# Most coder sessions the cycle runs at once. The default, 3, leaves room
# for the reviewer's checks on the same machine; lower it on a smaller one.
parallelism: 3

# Read by the cycle at wave cleanup.
worktree:
  # Worktree names (or absolute paths) that are never closed.
  keep: []
