name: Publish Pi package

# Publishes packages/pi to npm from pi/pkg-up when its version is not yet on
# the registry. Started by a push to pi/pkg-up that touches packages/pi, or by
# the sync workflow's dispatch after main is merged into pi/pkg-up.

on:
  push:
    branches: [pi/pkg-up]
    paths:
      - "packages/pi/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/pi/pkg-up'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test the package
        working-directory: packages/pi
        run: bun test

      - name: Read name and version
        id: pkg
        working-directory: packages/pi
        run: |
          set -euo pipefail
          echo "name=$(bun -e 'console.log(require("./package.json").name)')" >> "$GITHUB_OUTPUT"
          echo "version=$(bun -e 'console.log(require("./package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is published
        id: check
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: bash packages/pi/scripts/publish-decision.sh "$NAME" "$VERSION"

      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        working-directory: packages/pi
        env:
          # bun publish reads its registry token from NPM_CONFIG_TOKEN.
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --access public
