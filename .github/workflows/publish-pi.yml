name: Publish Pi package

# Publishes packages/pi to npm from pi/pkg-up when its version is not yet on
# the registry. Started by a push to pi/pkg-up that touches packages/pi, or by
# the sync workflow's dispatch after main is merged into pi/pkg-up.

on:
  push:
    branches: [pi/pkg-up]
    paths:
      - "packages/pi/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/pi/pkg-up'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test the package
        working-directory: packages/pi
        run: bun test

      - name: Read name and version
        id: pkg
        working-directory: packages/pi
        run: |
          set -euo pipefail
          echo "name=$(node -p 'require("./package.json").name')" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is published
        id: check
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -uo pipefail
          if out=$(npm view "${NAME}@${VERSION}" version 2>&1); then
            if [ -n "$out" ]; then
              echo "${NAME}@${VERSION} already published; nothing to do."
              echo "published=true" >> "$GITHUB_OUTPUT"
            else
              echo "${NAME}@${VERSION} not on npm yet."
              echo "published=false" >> "$GITHUB_OUTPUT"
            fi
          elif printf '%s\n' "$out" | grep -q 'E404'; then
            echo "${NAME}@${VERSION} not on npm yet (E404)."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm view ${NAME}@${VERSION} failed:"
            printf '%s\n' "$out"
            exit 1
          fi

      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        working-directory: packages/pi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
