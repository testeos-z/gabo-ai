# gbai project config (v0, hand-written before the compiler exists).
# Keys follow docs/product/DB_SCHEMA.md 3.2 and TRD 9.3. Agents may edit this
# file directly during the work; `gbai generate` validates it later (TRD D18).
# Personal keys (alias, interaction_level, tone, language) do not belong here:
# they live in ~/.config/gbai/config.yaml (TRD D11, D22).
version: 1
mode: manual

repo:
  name: testeos-z/gbai-team
  integration_branch: dev

runtimes:
  coder: claude
  reviewer: claude
  assistant: claude

generation:
  targets: [claude]

# Adapters are the Claude Code skills that fill each slot contract (TRD 9.1).
slots:
  tasks:
    adapter: .claude/skills/gbai-tasks-github/SKILL.md
  repository_host:
    adapter: .claude/skills/gbai-repository-host-github/SKILL.md
  memory:
    adapter: .claude/skills/gbai-memory-engram/SKILL.md
  methodology:
    adapter: .claude/skills/gbai-methodology-gentle-ai/SKILL.md
  # The reviewer agent covers the reviewer_placement contract: it invokes the
  # user-level gbai-reviewer skill scripts and relays the VERDICT line.
  reviewer_placement:
    adapter: .claude/agents/gbai-reviewer.md

reviewer:
  # local in single-user mode: the scripts run as the owner with the owner's gh login.
  placement: local
  signing:
    marker: gbai-reviewer-bot

review:
  # Split on whitespace and run as argv in a credential-free copy of the merged tree (no shell).
  checks:
    - go -C apps/cli build ./...
    - go -C apps/cli vet ./...
    - go -C apps/cli test ./...
  # Merges only into repo.integration_branch (dev), never main (TRD D13).
  auto_merge: true
  human_only_paths: [.github/, AGENTS.md, CLAUDE.md, gbai.yaml, .claude/]

# Git email -> alias (TRD D10). OWNER: change "Leo" if you prefer another alias.
# The local git user.email is dimasmerida15@gmail.com; both emails map to the owner.
developers:
  "d.merida@gobern.ai": Leo
  "dimasmerida15@gmail.com": Leo

plan_change:
  scope: group
  global_without_owner: false

parallelism: 3

worktree:
  keep: []
